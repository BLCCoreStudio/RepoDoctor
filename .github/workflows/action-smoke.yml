name: RepoDoctor Action Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Run local composite action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run RepoDoctor Action
        uses: ./
        with:
          path: .
          fail-under: "0"
          format: json
          language: en

      - name: Reject invalid score gate
        id: invalid-score-gate
        continue-on-error: true
        uses: ./
        with:
          path: .
          fail-under: "101"

      - name: Assert invalid score gate failed
        if: always()
        shell: bash
        env:
          INVALID_SCORE_OUTCOME: ${{ steps.invalid-score-gate.outcome }}
        run: |
          set -euo pipefail
          if [[ "$INVALID_SCORE_OUTCOME" != "failure" ]]; then
            echo "Expected invalid fail-under input to fail, got: $INVALID_SCORE_OUTCOME"
            exit 1
          fi
