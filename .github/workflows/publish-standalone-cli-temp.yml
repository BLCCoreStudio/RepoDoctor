name: Publish standalone CLI (temporary)

on:
  push:
    branches: ["improve/cli-first-run"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: v0.1.1
      ARCHIVE: RepoDoctor-v0.1.1-linux-x86_64.tar.gz
      STANDALONE: repodoctor-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download and verify existing release package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o "$ARCHIVE" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE}"
          curl --fail --location --retry 3 \
            -o SHA256SUMS.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SHA256SUMS.txt"
          sha256sum -c SHA256SUMS.txt

      - name: Validate packaged CLI before repacking
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          tar -xzf "$ARCHIVE" -C extracted
          mapfile -t launchers < <(find extracted -type f -name repodoctor -print)
          if [[ "${#launchers[@]}" -ne 1 ]]; then
            printf 'Expected exactly one packaged repodoctor launcher, found %s\n' "${#launchers[@]}" >&2
            exit 1
          fi
          chmod +x "${launchers[0]}"
          "${launchers[0]}" version | tee /tmp/package-version.txt
          grep -q '0.1.1' /tmp/package-version.txt

      - name: Build single-file self-extracting launcher
        shell: bash
        run: |
          set -euo pipefail
          cat > "$STANDALONE" <<'HEADER'
          #!/usr/bin/env bash
          set -euo pipefail
          PAYLOAD_OFFSET=00000000000000000000
          SELF="${BASH_SOURCE[0]}"
          TMP_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/repodoctor.XXXXXXXX")"

          cleanup() {
            rm -rf "$TMP_ROOT"
          }
          trap cleanup EXIT HUP INT TERM

          dd if="$SELF" bs=1 skip="$PAYLOAD_OFFSET" status=none | tar -xzf - -C "$TMP_ROOT"
          mapfile -t launchers < <(find "$TMP_ROOT" -type f -name repodoctor -print)
          if [[ "${#launchers[@]}" -ne 1 ]]; then
            printf 'RepoDoctor launcher could not be resolved after extraction.\n' >&2
            exit 1
          fi

          chmod +x "${launchers[0]}"
          "${launchers[0]}" "$@"
          HEADER

          HEADER_SIZE="$(stat -c %s "$STANDALONE")"
          OFFSET="$(printf '%020d' "$HEADER_SIZE")"
          python3 - "$STANDALONE" "$OFFSET" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          offset = sys.argv[2].encode()
          data = path.read_bytes()
          marker = b'00000000000000000000'
          if data.count(marker) != 1:
              raise SystemExit('payload marker is not unique')
          path.write_bytes(data.replace(marker, offset, 1))
          PY

          cat "$ARCHIVE" >> "$STANDALONE"
          chmod +x "$STANDALONE"
          ./$STANDALONE version | tee /tmp/standalone-version.txt
          grep -q '0.1.1' /tmp/standalone-version.txt
          ./$STANDALONE --help >/tmp/standalone-help.txt
          test -s /tmp/standalone-help.txt
          sha256sum "$STANDALONE" > "${STANDALONE}.sha256"

      - name: Upload standalone file to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$STANDALONE" \
            "${STANDALONE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published download end-to-end
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$STANDALONE" \
            --pattern "${STANDALONE}.sha256" \
            --dir verify
          cd verify
          sha256sum -c "${STANDALONE}.sha256"
          chmod +x "$STANDALONE"
          ./$STANDALONE version | tee /tmp/published-version.txt
          grep -q '0.1.1' /tmp/published-version.txt
